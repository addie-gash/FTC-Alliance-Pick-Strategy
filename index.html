<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTC Pick List Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-soft: rgba(56, 189, 248, 0.1);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .btn { background-color: var(--accent); color: #000; font-weight: 600; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; transition: background-color 0.2s; font-size: 0.9rem; }
    .btn:hover { background-color: var(--accent-hover); color: #fff; }
    .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-secondary:hover { background-color: var(--border-color); color: var(--text-main); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .btn-danger:hover { background-color: var(--danger); color: #fff; }
    .file-input-wrapper { position: relative; display: inline-block; }
    .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
    .panel-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: end; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--text-muted); }
    select, input[type="number"] { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
    select:focus, input:focus { border-color: var(--accent); }
    .desc-box { margin-top: 12px; font-size: 0.85rem; color: var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 6px; border-left: 3px solid var(--accent); }
    .weights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px; margin-top: 12px; }
    .slider-group { display: flex; flex-direction: column; gap: 4px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; }
    input[type="range"] { accent-color: var(--accent); cursor: pointer; }
    .table-container { overflow-x: auto; max-height: 500px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
    th { background-color: var(--card-bg); position: sticky; top: 0; color: var(--text-muted); font-weight: 600; z-index: 10; }
    tr:hover { background-color: rgba(255, 255, 255, 0.02); }
    .tag { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .tag-fit { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .tag-role { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .status-bar { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>⚡ FTC Pick List Builder</h1>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-danger" onclick="clearSavedData()">Clear Saved Data</button>
      <div class="file-input-wrapper">
        <button class="btn">Import CSV / Excel</button>
        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" onchange="handleFileUpload(event)">
      </div>
    </div>
  </header>

  <div class="panel">
    <div class="panel-title">Alliance Strategy</div>
    <div class="controls-grid">
      <div class="control-group">
        <label for="archetypeSelect">Our Archetype</label>
        <select id="archetypeSelect" onchange="onArchetypeChange()"></select>
      </div>
      <div class="control-group">
        <label for="excludeSelect">Exclude Team</label>
        <select id="excludeSelect" onchange="generateList()">
          <option value="">None</option>
        </select>
      </div>
      <div class="control-group">
        <label for="picksCount">Picks to Show</label>
        <input type="number" id="picksCount" value="12" min="1" max="50" onchange="generateList()">
      </div>
      <div>
        <button class="btn" style="width: 100%;" onclick="generateList()">Generate Pick List</button>
      </div>
    </div>
    <div class="desc-box" id="archetypeDesc">Select an archetype to configure model weights.</div>
  </div>

  <div class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="panel-title" style="margin: 0;">Model Weights</div>
      <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="resetWeights()">Reset Defaults</button>
    </div>
    <div class="weights-grid" id="weightsGrid"></div>
  </div>

  <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 50px; text-align: center;">Pick</th>
            <th style="width: 90px;">Team #</th>
            <th style="width: 140px;">Team Name</th>
            <th style="width: 70px;">Fit</th>
            <th style="width: 90px;">Role</th>
            <th style="width: 65px;">Scoring</th>
            <th style="width: 65px;">Auto</th>
            <th style="width: 75px;">Endgame</th>
            <th style="width: 85px;">Reliability</th>
            <th>Why</th>
          </tr>
        </thead>
        <tbody id="pickTableBody">
          <tr>
            <td colspan="10" class="empty-state">Import your scouting spreadsheet (CSV or XLSX) to begin.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">Awaiting dataset...</span>
  </div>

  <script>
    const ARCHETYPES = {
      "Balanced": { weights: { scoring: 24, auto: 16, endgame: 14, reliability: 18, defense: 8, passing: 8, driver: 6, mobility: 6 }, overlap: 0.08, description: "Balanced profile across all metrics." },
      "Primary Scorer": { weights: { scoring: 10, auto: 10, endgame: 18, reliability: 20, defense: 14, passing: 14, driver: 8, mobility: 6 }, overlap: 0.20, description: "Your team scores; model prioritizes complementary partners." },
      "Support / Feeder": { weights: { scoring: 24, auto: 16, endgame: 14, reliability: 16, defense: 8, passing: 4, driver: 10, mobility: 8 }, overlap: 0.05, description: "Prioritizes high-volume scoring partners." },
      "Defender": { weights: { scoring: 28, auto: 12, endgame: 14, reliability: 18, defense: 3, passing: 8, driver: 10, mobility: 7 }, overlap: 0.03, description: "Prioritizes high-output scoring and auto capacity." },
      "Auto Specialist": { weights: { scoring: 28, auto: 5, endgame: 18, reliability: 20, defense: 8, passing: 8, driver: 7, mobility: 6 }, overlap: 0.10, description: "Prioritizes TeleOp scoring and Endgame capability." },
      "Endgame Specialist": { weights: { scoring: 27, auto: 15, endgame: 5, reliability: 20, defense: 10, passing: 8, driver: 9, mobility: 6 }, overlap: 0.08, description: "Prioritizes scoring volume and Auto capability." }
    };

    const WEIGHT_LABELS = { scoring: "Scoring", auto: "Auto", endgame: "Endgame", reliability: "Reliability", defense: "Defense", passing: "Passing", driver: "Driver Skill", mobility: "Mobility" };

    let rawData = null;
    let activeWeights = { ...ARCHETYPES["Primary Scorer"].weights };

    window.addEventListener("DOMContentLoaded", () => {
      const archSelect = document.getElementById("archetypeSelect");
      Object.keys(ARCHETYPES).forEach(arch => {
        const opt = document.createElement("option");
        opt.value = arch;
        opt.innerText = arch;
        if (arch === "Primary Scorer") opt.selected = true;
        archSelect.appendChild(opt);
      });

      renderWeightSliders();
      onArchetypeChange();

      const savedData = localStorage.getItem("ftc_scouting_data");
      if (savedData) {
        try {
          rawData = JSON.parse(savedData);
          processData(rawData, false);
        } catch (e) {
          localStorage.removeItem("ftc_scouting_data");
        }
      }
    });

    function renderWeightSliders() {
      const grid = document.getElementById("weightsGrid");
      grid.innerHTML = "";
      Object.keys(WEIGHT_LABELS).forEach(key => {
        const div = document.createElement("div");
        div.className = "slider-group";
        div.innerHTML = `
          <div class="slider-header">
            <span>${WEIGHT_LABELS[key]}</span>
            <span id="val-${key}">${activeWeights[key]}%</span>
          </div>
          <input type="range" id="slider-${key}" min="0" max="50" value="${activeWeights[key]}" oninput="onSliderChange('${key}', this.value)">
        `;
        grid.appendChild(div);
      });
    }

    function onArchetypeChange() {
      const selected = document.getElementById("archetypeSelect").value;
      const arch = ARCHETYPES[selected];
      document.getElementById("archetypeDesc").innerText = arch.description;
      activeWeights = { ...arch.weights };
      Object.keys(activeWeights).forEach(key => {
        const slider = document.getElementById(`slider-${key}`);
        const valSpan = document.getElementById(`val-${key}`);
        if (slider) slider.value = activeWeights[key];
        if (valSpan) valSpan.innerText = activeWeights[key] + "%";
      });
      if (rawData) generateList();
    }

    function resetWeights() { onArchetypeChange(); }

    function onSliderChange(key, val) {
      activeWeights[key] = parseFloat(val);
      document.getElementById(`val-${key}`).innerText = val + "%";
      if (rawData) generateList();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      if (fileName.endsWith(".csv")) {
        Papa.parse(file, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: (results) => processData(results.data, true)
        });
      } else if (fileName.endsWith(".xlsx") || fileName.endsWith(".xls")) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          let sheetName = workbook.SheetNames[0];
          const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
          processData(jsonData, true);
        };
        reader.readAsArrayBuffer(file);
      }
    }

    // Smart Identifier extraction that separates long text from numerical team numbers
    function getTeamInfo(row) {
      const keys = Object.keys(row);
      let rawColA = keys.length > 0 ? String(row[keys[0]] || "").trim() : "";
      let rawColB = keys.length > 1 ? String(row[keys[1]] || "").trim() : "";

      // Check header matches
      for (let k of keys) {
        const clean = k.replace(/[^a-zA-Z0-9#]/g, '').toLowerCase();
        if (clean === 'team#' || clean === 'teamnumber' || clean === 'teamnum' || clean === 'teamno') {
          if (row[k]) rawColA = String(row[k]).trim();
        }
        if (clean === 'teamname' || clean === 'name' || clean === 'robotname') {
          if (row[k]) rawColB = String(row[k]).trim();
        }
      }

      // If Column A contains a long school/team name instead of a number
      if (isNaN(Number(rawColA)) && rawColA.length > 5) {
        return {
          number: rawColB && !isNaN(Number(rawColB)) ? rawColB : "TBD",
          name: rawColA
        };
      }

      return {
        number: rawColA || "TBD",
        name: rawColB
      };
    }

    function processData(data, saveToStorage = true) {
      if (!data || data.length === 0) return;

      rawData = data;
      if (saveToStorage) {
        localStorage.setItem("ftc_scouting_data", JSON.stringify(data));
      }

      const excludeSelect = document.getElementById("excludeSelect");
      excludeSelect.innerHTML = '<option value="">None</option>';
      
      const teams = Array.from(new Set(data.map(d => getTeamInfo(d).number))).filter(Boolean);
      teams.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.innerText = t;
        excludeSelect.appendChild(opt);
      });

      document.getElementById("statusText").innerText = `Loaded ${data.length} records. Data saved locally.`;
      generateList();
    }

    function clearSavedData() {
      localStorage.removeItem("ftc_scouting_data");
      rawData = null;
      document.getElementById("pickTableBody").innerHTML = `<tr><td colspan="10" class="empty-state">Data cleared. Import a new spreadsheet.</td></tr>`;
      document.getElementById("statusText").innerText = "Awaiting dataset...";
      document.getElementById("excludeSelect").innerHTML = '<option value="">None</option>';
    }

    function safeNum(val) {
      const n = parseFloat(val);
      return isNaN(n) ? 0 : n;
    }

    function meanCols(row, cols) {
      let sum = 0, count = 0;
      cols.forEach(c => {
        if (row.hasOwnProperty(c)) {
          sum += safeNum(row[c]);
          count++;
        }
      });
      return count > 0 ? sum / count : 0;
    }

    function normSeries(data, col) {
      const vals = data.map(d => safeNum(d[col]));
      const min = Math.min(...vals);
      const max = Math.max(...vals);
      if (max - min < 1e-9) return data.map(() => 50);
      return vals.map(v => ((v - min) / (max - min)) * 100);
    }

    function generateList() {
      if (!rawData) return;

      const excludeTeam = document.getElementById("excludeSelect").value;
      const topN = parseInt(document.getElementById("picksCount").value) || 12;

      const fuelNorm = normSeries(rawData, "Fuel Scored");
      const speedNorm = normSeries(rawData, "Shooting Speed");
      const accuracyNorm = normSeries(rawData, "Shooting Accuracy");
      const driverNorm = normSeries(rawData, "Driver Ability");
      const defenseNorm = normSeries(rawData, "Defense Effectiveness");

      const scoringCols = ["Primary Scorer", "Shooting", "Cycling", "Shooting From Anywhere", "Shooting From Close", "Shooting From Far"];
      const autoCols = ["Preload", "Single Swipe", "Double Swipe", "Depot", "Outpost", "Auto Climb Status"];
      const endgameCols = ["L1", "L2", "L3"];
      const passingCols = ["Passing", "Full Field Passing", "Feeding H P"];
      const mobilityCols = ["Fast Robot", "Goes Behind Tower", "Unbeached Quick"];
      const defenseCols = ["Defending", "Defense Effectiveness"];
      const failureCols = ["Auto Failed", "Auto Beached", "Delayed Auto", "Beached On Fuel", "Beached On Bump", "Bumper Fell Off", "Browning Out", "Immobile", "Turned Off", "Shooter Jammed", "Intake Jammed", "Intake Broke", "Other Break", "No Show", "Climb Failed"];

      let scoredData = rawData.map((row, idx) => {
        const info = getTeamInfo(row);
        const _scoring = Math.min(100, Math.max(0, 0.55 * (meanCols(row, scoringCols) * 100) + 0.20 * fuelNorm[idx] + 0.15 * accuracyNorm[idx] + 0.10 * speedNorm[idx]));
        const _auto = Math.min(100, Math.max(0, 0.70 * (meanCols(row, autoCols) * 100) + 0.20 * fuelNorm[idx] + 0.10 * accuracyNorm[idx]));
        const _endgame = Math.min(100, Math.max(0, meanCols(row, endgameCols) * 100));
        const _reliability = Math.min(100, Math.max(0, 100 - meanCols(row, failureCols) * 100));
        const _defense = Math.min(100, Math.max(0, 0.65 * (meanCols(row, defenseCols) * 100) + 0.35 * defenseNorm[idx]));
        const _passing = Math.min(100, Math.max(0, meanCols(row, passingCols) * 100));
        const _driver = Math.min(100, Math.max(0, driverNorm[idx]));
        const _mobility = Math.min(100, Math.max(0, mobilityCols.length ? meanCols(row, mobilityCols) * 100 : 50));

        const _overall = (0.30 * _scoring + 0.12 * _auto + 0.12 * _endgame + 0.20 * _reliability + 0.08 * _defense + 0.07 * _passing + 0.06 * _driver + 0.05 * _mobility);

        return {
          TeamNumber: info.number,
          TeamName: info.name,
          _scoring, _auto, _endgame, _reliability, _defense, _passing, _driver, _mobility, _overall
        };
      });

      if (excludeTeam) {
        scoredData = scoredData.filter(d => d.TeamNumber !== String(excludeTeam));
      }

      const wSum = Object.values(activeWeights).reduce((a, b) => a + b, 0) || 1;
      const w = {};
      Object.keys(activeWeights).forEach(k => w[k] = activeWeights[k] / wSum);

      scoredData.forEach(d => {
        const base = (w.scoring * d._scoring + w.auto * d._auto + w.endgame * d._endgame + w.reliability * d._reliability + w.defense * d._defense + w.passing * d._passing + w.driver * d._driver + w.mobility * d._mobility);
        d._fit = Math.min(100, Math.max(0, (base * (0.65 + 0.35 * (d._reliability / 100))) + 0.04 * d._overall));
        
        const roleVals = { "Scorer": d._scoring, "Auto": d._auto, "Endgame": d._endgame, "Defense": d._defense, "Passing": d._passing };
        d._role = Object.keys(roleVals).reduce((a, b) => roleVals[a] > roleVals[b] ? a : b);
        d._why = `strong performance profile`;
      });

      scoredData.sort((a, b) => b._fit - a._fit);
      renderTable(scoredData.slice(0, topN));
    }

    function renderTable(data) {
      const tbody = document.getElementById("pickTableBody");
      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="empty-state">No matching teams found.</td></tr>`;
        return;
      }
      data.forEach((r, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="text-align: center; font-weight: bold; color: var(--text-muted);">${idx + 1}</td>
          <td style="font-weight: 600;">${r.TeamNumber}</td>
          <td style="color: var(--text-muted);">${r.TeamName}</td>
          <td><span class="tag tag-fit">${r._fit.toFixed(1)}</span></td>
          <td><span class="tag tag-role">${r._role}</span></td>
          <td>${Math.round(r._scoring)}</td>
          <td>${Math.round(r._auto)}</td>
          <td>${Math.round(r._endgame)}</td>
          <td>${Math.round(r._reliability)}</td>
          <td style="color: var(--text-muted); font-size: 0.85rem;">${r._why}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
